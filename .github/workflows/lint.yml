
name: Auto-linter

on:
  push:
    paths:
      - '**.py'

jobs:
  code:
    runs-on: ubuntu-latest

    steps:
      # Checkout / clone the repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Install Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Install Ruff
      - name: Install Linter
        run: pip install ruff
